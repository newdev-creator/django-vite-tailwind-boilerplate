name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  # ============================================================================
  # Job 1 — Lint
  # ============================================================================
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install dependencies
        run: uv sync --frozen

      - name: Run ruff check
        run: uv run ruff check .

      - name: Run ruff format check
        run: uv run ruff format --check .

  # ============================================================================
  # Job 2 — Tests Django
  # ============================================================================
  test:
    name: Tests Django
    runs-on: ubuntu-latest
    needs: lint

    env:
      DEBUG: "False"
      secret_key: "django-insecure-ci-key-not-for-production"
      DATABASE_URL: "sqlite:///ci-db.sqlite3"
      ALLOWED_HOST: "localhost"
      CSRF_TRUSTED_ORIGINS: "http://localhost"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install Python dependencies
        run: uv sync --frozen

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Install Node dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Vite assets
        run: pnpm run build

      - name: Run migrations
        run: uv run python manage.py migrate --noinput

      - name: Run tests
        run: uv run python manage.py test

  # ============================================================================
  # Job 3 — Build Docker (vérifie que l'image prod se construit)
  # ============================================================================
  build:
    name: Build Docker image
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          dockerfile: Dockerfile
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ============================================================================
  # Job 4 — Deploy via Coolify webhook (main uniquement)
  # ============================================================================
  deploy:
    name: Deploy sur Coolify
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Trigger Coolify webhook
        run: |
          curl --silent --show-error --fail \
            -X GET "${{ secrets.COOLIFY_WEBHOOK_URL }}" \
            -H "Authorization: Bearer ${{ secrets.COOLIFY_WEBHOOK_TOKEN }}"
